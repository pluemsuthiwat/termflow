# macOS app: npm run dist  ->  dist/Termflow-<version>-arm64.dmg (+ .zip)
appId: io.github.pluemsuthiwat.termflow
productName: Termflow
copyright: Copyright © 2026 Suthiwat Srisen
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# node-pty runs its spawn-helper as a program: it has to live outside app.asar.
asarUnpack:
  - node_modules/node-pty/**
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Lets macOS ask for Local Network access; without it LAN hosts fail with EHOSTUNREACH.
  extendInfo:
    NSLocalNetworkUsageDescription: Termflow connects to SSH hosts on your local network.
  # Developer ID signature + notarization, so downloads pass Gatekeeper. Notarizing uses the
  # notarytool keychain profile named in APPLE_KEYCHAIN_PROFILE (see the dist script);
  # without it the build is signed but not notarized. Entitlements: electron-builder's
  # default Electron set (JIT, unsigned executable memory, library validation off).
  identity: Suthiwat Srisen (FHJV635JGF)
  hardenedRuntime: true
  notarize: true
# Gives the executable its own Mach-O UUID so the Local Network grant sticks to Termflow.
afterPack: build/unique-uuid.js
dmg:
  title: Termflow ${version}
# Packaged app can't be run as plain Node, take NODE_OPTIONS / --inspect, or load
# code from outside its (integrity-checked) app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
